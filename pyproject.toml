[project]
name = "prestamos"
version = "1.0.0"
description = "API de préstamo de equipos de laboratorio con FastAPI y SQLModel"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "sqlmodel==0.0.42",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
